<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore historic forts associated with Chhatrapati Shivaji Maharaj.">
  <title>Forts Exploration Project | Project by PSB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="forts-page">
  <main class="forts-exploration">
    <header class="forts-heading">
      <a class="back-link" href="project.html">Project by PSB</a>
      <h1>Forts Exploration Project</h1>
      <p>Discover the forts and legacy of Chhatrapati Shivaji Maharaj.</p>
    </header>

    <section class="fort-carousel" aria-label="Forts of Shivaji Maharaj">
      <div class="fort-slide" id="fortSlide" aria-live="polite"></div>
      <button class="carousel-control previous" id="previousFort" type="button" aria-label="Previous fort">&#10094;</button>
      <button class="carousel-control next" id="nextFort" type="button" aria-label="Next fort">&#10095;</button>
      <div class="carousel-indicators" id="fortIndicators" aria-label="Choose a fort"></div>
    </section>
  </main>

  <script src="forts.js"></script>
</body>
</html>
